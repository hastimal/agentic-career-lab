<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="boundaryGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#059669" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Canvas Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="144" height="28" rx="6" fill="#ecfdf5"/>
    <text x="12" y="19" font-size="12" font-weight="700" fill="#059669" letter-spacing="1">LOCAL RUNTIME</text>
    <text x="0" y="65" font-size="32" font-weight="800" fill="#0f172a">Private Resume Processing Architecture</text>
    <text x="0" y="92" font-size="16" font-weight="400" fill="#475569">Local execution boundary: raw resume text is parsed in volatile RAM and evaluated on-device with zero cloud transmission</text>
  </g>

  <!-- Big Local Processing Boundary Box -->
  <g transform="translate(80, 175)">
    <rect x="0" y="0" width="1440" height="660" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#boundaryGlow)"/>
    
    <!-- Boundary Header Badge -->
    <rect x="30" y="24" width="280" height="36" rx="8" fill="#10b981"/>
    <text x="46" y="47" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">🔒 LOCAL / PRIVATE BOUNDARY</text>
    <text x="325" y="48" font-size="14" font-weight="500" fill="#475569">All unredacted resume data, text embeddings, and model weights remain on the host workstation</text>

    <!-- Subgraph: Docker Compose Container -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="840" height="540" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,6"/>
      <rect x="24" y="20" width="310" height="30" rx="6" fill="#eff6ff"/>
      <text x="36" y="40" font-size="13" font-weight="700" fill="#1d4ed8">🐳 DOCKER CONTAINER (App Service :8501)</text>

      <!-- Step 1: Candidate Input -->
      <g transform="translate(35, 80)">
        <rect x="0" y="0" width="220" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="0" y="0" width="220" height="52" rx="14" fill="#f1f5f9"/>
        <text x="18" y="32" font-size="15" font-weight="700" fill="#1e293b">1. Student Upload</text>
        
        <g transform="translate(18, 75)">
          <rect x="0" y="0" width="184" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="26" font-size="13" font-weight="600" fill="#0f172a">📄 Resume File</text>
          <text x="14" y="46" font-size="11" fill="#64748b">.docx / .pdf / raw text</text>
        </g>

        <g transform="translate(18, 160)">
          <rect x="0" y="0" width="184" height="110" rx="8" fill="#fef2f2" stroke="#fecaca"/>
          <text x="14" y="24" font-size="12" font-weight="700" fill="#991b1b">⚠️ Sensitive PII Data</text>
          <text x="14" y="46" font-size="11" fill="#7f1d1d">• Full legal candidate name</text>
          <text x="14" y="66" font-size="11" fill="#7f1d1d">• Phone, address, emails</text>
          <text x="14" y="86" font-size="11" fill="#7f1d1d">• Proprietary employment</text>
        </g>

        <g transform="translate(18, 290)">
          <rect x="0" y="0" width="184" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="24" font-size="12" font-weight="600" fill="#334155">In-Memory Parser</text>
          <text x="14" y="44" font-size="11" fill="#64748b">• Volatile memory only</text>
          <text x="14" y="64" font-size="11" fill="#64748b">• Discarded on session end</text>
          <text x="14" y="84" font-size="11" fill="#64748b">• Zero disk persistence</text>
        </g>
      </g>

      <!-- Step 2: Streamlit UI & Coordinator -->
      <g transform="translate(300, 80)">
        <rect x="0" y="0" width="230" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="0" y="0" width="230" height="52" rx="14" fill="#f1f5f9"/>
        <text x="18" y="32" font-size="15" font-weight="700" fill="#1e293b">2. Streamlit Web UI</text>

        <g transform="translate(18, 75)">
          <rect x="0" y="0" width="194" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="24" font-size="12" font-weight="600" fill="#0f172a">Session State</text>
          <text x="14" y="46" font-size="11" fill="#475569">Target Job Selected:</text>
          <text x="14" y="66" font-size="11" font-weight="600" fill="#2563eb">AI Engineering Intern</text>
        </g>

        <g transform="translate(18, 180)">
          <rect x="0" y="0" width="194" height="210" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
          <text x="14" y="26" font-size="13" font-weight="700" fill="#166534">Coordinator Dispatch</text>
          <text x="14" y="52" font-size="11" fill="#15803d">CareerCoordinator</text>
          <text x="14" y="70" font-size="11" font-weight="600" fill="#15803d">.execute_action(PREPARE)</text>
          <line x1="14" y1="84" x2="180" y2="84" stroke="#bbf7d0" stroke-width="1"/>
          <text x="14" y="106" font-size="11" fill="#334155">• HybridRouter.route()</text>
          <text x="14" y="126" font-size="11" font-weight="600" fill="#047857">  PrivacyLevel.PRIVATE</text>
          <text x="14" y="146" font-size="11" fill="#334155">• Enforces Local Inference</text>
          <text x="14" y="166" font-size="11" fill="#dc2626">• Fail-closed on timeout</text>
          <text x="14" y="186" font-size="11" fill="#64748b">• No silent cloud fallback</text>
        </g>
      </g>

      <!-- Step 3: Private Resume Agent Engine -->
      <g transform="translate(575, 80)">
        <rect x="0" y="0" width="230" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="0" y="0" width="230" height="52" rx="14" fill="#ecfdf5"/>
        <text x="18" y="32" font-size="15" font-weight="700" fill="#065f46">3. Private Resume Agent</text>

        <g transform="translate(18, 75)">
          <rect x="0" y="0" width="194" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="24" font-size="12" font-weight="600" fill="#0f172a">ResumeExtractor</text>
          <text x="14" y="46" font-size="11" fill="#64748b">• Constructs JSON schema</text>
          <text x="14" y="66" font-size="11" fill="#64748b">• Prompts local model</text>
          <text x="14" y="84" font-size="11" fill="#64748b">• Parses raw output</text>
        </g>

        <g transform="translate(18, 180)">
          <rect x="0" y="0" width="194" height="210" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="14" y="26" font-size="12" font-weight="600" fill="#0f172a">OllamaGemmaClient</text>
          <text x="14" y="48" font-size="11" fill="#475569">Target endpoint:</text>
          <text x="14" y="68" font-size="10.5" font-weight="600" fill="#1e293b">host.docker.internal:11434</text>
          <line x1="14" y1="80" x2="180" y2="80" stroke="#e2e8f0" stroke-width="1"/>
          <text x="14" y="100" font-size="11" fill="#64748b">• HTTP POST /api/generate</text>
          <text x="14" y="120" font-size="11" fill="#64748b">• Defensive timeouts</text>
          <text x="14" y="140" font-size="11" fill="#64748b">• Model: gemma4:12b</text>
          <text x="14" y="160" font-size="11" fill="#64748b">• Stream: false (AST batch)</text>
          <text x="14" y="180" font-size="11" fill="#64748b">• Sanitized OTel span</text>
        </g>
      </g>
    </g>

    <!-- Subgraph: Host Machine Native Runtime -->
    <g transform="translate(900, 80)">
      <rect x="0" y="0" width="505" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="24" y="20" width="370" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="36" y="40" font-size="13" font-weight="700" fill="#334155">💻 MACOS HOST WORKSTATION (Native Runtime)</text>

      <!-- Step 4: Ollama Service -->
      <g transform="translate(30, 80)">
        <rect x="0" y="0" width="205" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="0" y="0" width="205" height="52" rx="14" fill="#f8fafc"/>
        <text x="16" y="32" font-size="15" font-weight="700" fill="#0f172a">4. Native Ollama</text>

        <g transform="translate(14, 75)">
          <rect x="0" y="0" width="177" height="90" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
          <text x="12" y="24" font-size="12" font-weight="700" fill="#1e293b">HTTP Port 11434</text>
          <text x="12" y="46" font-size="11" fill="#475569">Binds: 127.0.0.1</text>
          <text x="12" y="66" font-size="11" fill="#475569">Bridged via host-gateway</text>
          <text x="12" y="84" font-size="11" fill="#64748b">Zero external exposure</text>
        </g>

        <g transform="translate(14, 180)">
          <rect x="0" y="0" width="177" height="210" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
          <text x="12" y="26" font-size="12" font-weight="700" fill="#166534">Apple Silicon Metal</text>
          <text x="12" y="48" font-size="11" fill="#15803d">• Metal GPU Acceleration</text>
          <text x="12" y="68" font-size="11" fill="#15803d">• Unified Memory (UMA)</text>
          <text x="12" y="88" font-size="11" fill="#15803d">• Zero hypervisor overhead</text>
          <line x1="12" y1="104" x2="165" y2="104" stroke="#bbf7d0" stroke-width="1"/>
          <text x="12" y="126" font-size="11" fill="#334155">Observed Execution:</text>
          <text x="12" y="146" font-size="11" font-weight="600" fill="#0f172a">2 Sequential Calls:</text>
          <text x="12" y="166" font-size="11" fill="#475569">Call 1: 40.4s (1.3k tok)</text>
          <text x="12" y="186" font-size="11" fill="#475569">Call 2: 60.6s (1.8k tok)</text>
        </g>
      </g>

      <!-- Step 5: Gemma 4 Model & Structured Output -->
      <g transform="translate(260, 80)">
        <rect x="0" y="0" width="215" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="0" y="0" width="215" height="52" rx="14" fill="#ecfdf5"/>
        <text x="16" y="32" font-size="15" font-weight="700" fill="#065f46">5. Gemma 4 &amp; Output</text>

        <g transform="translate(14, 75)">
          <rect x="0" y="0" width="187" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="12" y="24" font-size="12" font-weight="700" fill="#0f172a">Google Gemma 4</text>
          <text x="12" y="46" font-size="11" fill="#475569">Model: gemma4:12b</text>
          <text x="12" y="66" font-size="11" fill="#475569">Footprint: ~8.1 GB</text>
          <text x="12" y="86" font-size="11" fill="#475569">Quantization: 4-bit (Q4_K_M)</text>
          <text x="12" y="104" font-size="11" fill="#64748b">Location: ~/.ollama/models</text>
        </g>

        <g transform="translate(14, 200)">
          <rect x="0" y="0" width="187" height="190" rx="8" fill="#f0fdf4" stroke="#86efac"/>
          <text x="12" y="26" font-size="12" font-weight="700" fill="#166534">Structured Evidence</text>
          <text x="12" y="48" font-size="11" fill="#15803d">✅ Extracted Skills:</text>
          <text x="12" y="68" font-size="10.5" font-weight="600" fill="#047857">["Python", "Docker", "SQL"]</text>
          <text x="12" y="92" font-size="11" fill="#15803d">✅ Experience Matches:</text>
          <text x="12" y="112" font-size="10.5" fill="#334155">Demonstrated with proof</text>
          <line x1="12" y1="128" x2="175" y2="128" stroke="#86efac" stroke-width="1"/>
          <text x="12" y="148" font-size="11" font-weight="700" fill="#0f172a">Result Ready for UI</text>
          <text x="12" y="168" font-size="10.5" fill="#475569">Zero PII leaves boundary</text>
        </g>
      </g>
    </g>

    <!-- Connecting Arrows -->
    <!-- Step 1 -> Step 2 -->
    <path d="M 285 270 L 325 270" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <!-- Step 2 -> Step 3 -->
    <path d="M 560 270 L 600 270" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <!-- Step 3 -> Step 4 (Across Docker Network Bridge) -->
    <path d="M 835 270 L 925 270" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
    <text x="845" y="258" font-size="10" font-weight="700" fill="#2563eb">host.docker.internal</text>
    <!-- Step 4 -> Step 5 -->
    <path d="M 1135 270 L 1155 270" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>

