services:
  # Agentic Career Lab Application (Streamlit + Google ADK + Private Agents)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-career-lab:latest
    container_name: agentic-career-lab-app
    ports:
      - "8501:8501"
    environment:
      # Use host.docker.internal to route to host's native Ollama runtime (optimal for Apple Silicon & local dev)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma4:12b}
      - JOB_PROVIDER=${JOB_PROVIDER:-mock}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - ADZUNA_COUNTRY=${ADZUNA_COUNTRY:-us}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional containerized Ollama service for standalone deployment (e.g. Linux servers / self-contained)
  ollama:
    image: ollama/ollama:latest
    container_name: agentic-career-lab-ollama
    profiles:
      - standalone
      - ollama-container
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional Observability Stack: OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: agentic-career-lab-otel-collector
    profiles:
      - observability
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8888:8888" # Internal collector metrics
      - "127.0.0.1:8889:8889" # Prometheus metrics exporter
    restart: unless-stopped

  # Optional Observability Stack: Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agentic-career-lab-prometheus
    profiles:
      - observability
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # Optional Observability Stack: Tempo (Traces)
  tempo:
    image: grafana/tempo:2.6.1
    container_name: agentic-career-lab-tempo
    profiles:
      - observability
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200" # Tempo HTTP
    restart: unless-stopped

  # Optional Observability Stack: Grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: agentic-career-lab-grafana
    profiles:
      - observability
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  ollama_models:
    name: agentic_career_lab_ollama_models
