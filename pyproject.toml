[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-career-lab"
version = "0.10.2"
description = "A privacy-first hybrid multi-agent career platform for college students and job seekers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Hastimal Jangid" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.2.0",
    "google-adk>=0.1.0",
    "opentelemetry-api>=1.39.0,<=1.42.1",
    "opentelemetry-sdk>=1.39.0,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<=1.42.1",
    "prometheus-client>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/hastimal/agentic-career-lab"
Documentation = "https://github.com/hastimal/agentic-career-lab/blob/main/README.md"
Repository = "https://github.com/hastimal/agentic-career-lab"
Issues = "https://github.com/hastimal/agentic-career-lab/issues"
Changelog = "https://github.com/hastimal/agentic-career-lab/releases"

[project.scripts]
agentic-career-lab = "agentic_career_lab.cli:main"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_career_lab"]

